<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>HS BG Assistant</title>
    <style>
      /*
        Оверлей лежит поверх игры, поэтому читаемость важнее вида: тёмная
        подложка под текстом, а не под всем окном, и никакого фона там,
        где текста нет.
      */
      :root {
        color-scheme: dark;
        --good: #7ee08a;
        --warn: #f0c674;
        --muted: #9aa0a6;
        /* Подложка блока и его рельс: оттенком, а не рамкой — рамка на
           прозрачном окне спорит с рамками самой игры. */
        --panel: rgba(255, 255, 255, 0.05);
        --rail: rgba(255, 255, 255, 0.16);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font: 13px/1.45 'Segoe UI', system-ui, sans-serif;
        color: #eceff1;
      }

      /*
        Окно теперь во весь экран — метки рисуются поверх настоящих карт.
        Панель советов стала блоком в правом верхнем углу, и её геометрия
        живёт здесь: окно с ней больше не совпадает.
      */
      #card {
        position: fixed;
        top: 24px;
        right: 24px;
        width: 460px;
        box-sizing: border-box;
        margin: 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(16, 18, 22, 0.78);
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(2px);
      }

      /*
        Слой меток — это ЭКРАН игры, а не окно.
        Совпадают они не всегда: Windows ужимает окно до рабочей области,
        и тогда доли высоты считались бы от меньшего числа, а метки ползли бы
        вверх тем сильнее, чем ниже стоят (жалоба part46 про силу героя).
        Начальные значения — на случай, если прямоугольник экрана ещё
        не пришёл: тогда слой ведёт себя как прежде, во всё окно.
      */
      #stage {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /*
        Кольцо вокруг карты. Контуров два — тёмный снаружи и внутри, цветной
        между ними: поверх пёстрой картинки игры одноцветная обводка теряется
        на светлых участках, и это видно на настоящих кадрах.
      */
      .ring {
        position: absolute;
        box-sizing: border-box;
        border-radius: 50%;
        border: 4px solid var(--c);
        box-shadow:
          0 0 0 2px rgba(0, 0, 0, 0.65),
          inset 0 0 0 2px rgba(0, 0, 0, 0.55),
          0 0 14px var(--c);
      }
      .ring.buy {
        --c: #46e07a;
      }
      .ring.sell {
        --c: #ff5a4d;
      }
      .ring.keep {
        --c: #ffd60a;
      }
      .ring.target {
        --c: #7ee0ff;
      }
      /*
        Кнопки таверны. Цвет отдельный не для красоты: кнопка подъёма сама
        зелёно-золотая, а вокруг обновления и заморозки игра рисует СВОИ
        зелёные рамки доступности — зелёное кольцо на них теряется дважды
        (жалоба игрока по part41). Пурпурного в палитре таверны нет.
      */
      .ring.tavern {
        --c: #ff4fd6;
      }

      /* Подпись действия — тёмная плашка: слово обязано читаться на любом фоне. */
      .tag {
        position: absolute;
        transform: translateX(-50%);
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(12, 14, 18, 0.88);
        border: 1px solid var(--c);
        color: #fff;
        font-weight: 700;
        font-size: 13px;
        white-space: nowrap;
      }
      .tag.buy {
        --c: #46e07a;
      }
      .tag.sell {
        --c: #ff5a4d;
      }
      .tag.keep {
        --c: #ffd60a;
      }
      .tag.target {
        --c: #7ee0ff;
      }
      .tag.tavern {
        --c: #ff4fd6;
      }

      /*
        Номер шага плана — на самой карте: ход читается со стола.
        Цвет номера следует смыслу шага, а не всегда «покупка»: зелёный кружок
        на карте, которую советуют ПРОДАТЬ, читается ровно наоборот.
      */
      .stepno {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--c);
        color: #06240f;
        font-weight: 800;
        font-size: 16px;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.6);
      }
      .stepno.buy {
        --c: #46e07a;
      }
      .stepno.sell {
        --c: #ff5a4d;
      }
      .stepno.keep {
        --c: #ffd60a;
      }
      .stepno.target {
        --c: #7ee0ff;
      }
      .stepno.tavern {
        --c: #ff4fd6;
        /* Цифра на пурпурном: тёмно-вишнёвый читается, тёмно-зелёный нет. */
        color: #2b0322;
      }

      /* Номер места в расстановке — над своим миньоном. */
      .orderno {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(12, 14, 18, 0.9);
        border: 2px solid #7ee0ff;
        color: #eaf7ff;
        font-weight: 700;
        font-size: 17px;
      }
      /* Двигать надо именно его — цвет и форма меняются вместе, не только цвет. */
      .orderno.moved {
        border-color: #ffd60a;
        border-width: 3px;
        color: #fff3c4;
      }

      #card.idle {
        background: rgba(16, 18, 22, 0.5);
      }

      #header {
        font-weight: 600;
        letter-spacing: 0.2px;
        margin-bottom: 6px;
      }

      /*
        Всё в панели переносится целиком и ничего не обрезается: обрезанный
        совет игрок прочитать не смог (part9, лавка аксессуаров — «оценить
        не берё…»). Обрезавшийся класс `.row` тут был ровно один — под борд
        и витрину, — а их в панели больше нет: стол игрок видит сам.
      */
      .line {
        margin: 2px 0;
        white-space: normal;
        overflow: visible;
      }

      #main .line,
      #alternatives .line,
      #position .line,
      #reminders .line {
        padding-left: 12px;
        text-indent: -12px; /* висячий отступ: перенос виден как продолжение */
      }

      .label {
        color: var(--muted);
        margin-right: 4px;
      }

      .good {
        color: var(--good);
      }
      .warn {
        color: var(--warn);
      }
      .muted {
        color: var(--muted);
      }

      #main {
        margin-top: 6px;
      }

      /* ── Свёрнутые разделы ───────────────────────────────────────────── */

      /*
        На виду — только основная линия (план или верхний совет), всё
        остальное свёрнуто в кнопки и раскрывается щелчком (D285). Кнопки
        стоят в ОДНУ строку, а не столбиком заголовков: свёрнутая панель
        обязана быть короткой, иначе сворачивать было незачем.

        Кнопка — единственное место окна, которое принимает щелчок, и только
        пока курсор на ней; поэтому она обязана выглядеть кнопкой, а курсор
        над ней — меняться.
      */
      #chips:not(:empty) {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
      }

      .chip {
        font: inherit;
        font-size: 12px;
        line-height: 1.35;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--rail);
        border-radius: 999px;
        padding: 1px 9px 2px;
        cursor: pointer;
        white-space: nowrap;
      }

      .chip:hover {
        color: #eceff1;
        border-color: rgba(255, 255, 255, 0.36);
      }

      .chip.open {
        color: #eceff1;
        background: rgba(255, 255, 255, 0.11);
      }

      /*
        Тон кнопки — тон самой весомой строки внутри (`OverlaySection`):
        свёрнутый раздел прячет строки, но не их вес. Правила стоят ПОСЛЕ
        наведения, чтобы жёлтое и зелёное не белели под курсором.
      */
      .chip.good {
        color: var(--good);
        border-color: rgba(126, 224, 138, 0.5);
      }

      .chip.warn {
        color: var(--warn);
        border-color: rgba(240, 198, 116, 0.55);
      }

      /* Раскрытые разделы — под кнопками, в порядке кнопок. */
      #details > * {
        margin-top: 8px;
      }

      /* ── План хода ───────────────────────────────────────────────────── */

      #plan:not(:empty) {
        margin-top: 8px;
        padding: 5px 8px 6px 9px;
        border-left: 3px solid var(--rail);
        border-radius: 0 6px 6px 0;
        background: var(--panel);
      }

      #plan .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 12px;
        font-weight: 600;
        color: var(--good);
      }

      #plan .head .cap {
        color: var(--muted);
        font-weight: 400;
      }

      /*
        Сетка, а не висячий отступ: у шага три колонки, и остаток золота справа
        обязан стоять на месте при переносе текста. Перенос происходит внутри
        средней ячейки и на цифру не наезжает; ничего не обрезается.
      */
      .step {
        display: grid;
        grid-template-columns: 14px 1fr 34px;
        column-gap: 6px;
        align-items: baseline;
        margin-top: 4px;
      }

      .step .no {
        font-size: 12px;
        color: var(--muted);
      }

      .step .what {
        white-space: normal;
      }

      /* Столбик остатка не должен дышать по ширине от кадра к кадру. */
      .step .gold {
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }

      .step .gold.warn {
        color: var(--warn);
      }

      #plan .rest,
      #plan .tail {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
      }

      #plan .tail.warn {
        color: var(--warn);
      }

      /* ── Темп таверны ────────────────────────────────────────────────── */

      #tempo {
        font-size: 12px;
        color: var(--muted);
      }

      #tempo .strip {
        display: inline-flex;
        gap: 3px;
        margin: 0 6px;
        vertical-align: bottom;
      }

      /*
        Клетка — столбик «число сверху, подпись снизу»: рамку и тень игрок
        читать не обязан, а вопрос «что это вообще значит» уже задан вслух
        (part43). Подписи стоят у САМИХ клеток, а не только строкой ниже:
        строку ниже надо сначала связать со шкалой глазами, и пока этого
        не сделано, шкала читается как указание.
      */
      #tempo .cell {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.1;
      }

      /*
        Подпись одна и та же по цвету и размеру у «вы» и у «кривой»: цветом
        или размером одна из них стала бы главной, а вердикта у кривой нет
        (см. `OverlayTempo`). Пустая подпись держит высоту — иначе клетки
        прыгают по вертикали.
      */
      #tempo .cap {
        font-size: 9px;
        color: var(--muted);
        min-height: 10px;
        white-space: nowrap;
      }

      /*
        Рамка занята прозрачной у ВСЕХ клеток: иначе клетка «вы» шире прочих,
        и шкала дёргается на подъёме тира. Кривая помечена внутренней тенью,
        а не подчёркиванием: тень не меняет высоту клетки.

        Метки нарочно РАЗНОЙ ПРИРОДЫ, а не разного цвета: положение игрока —
        рамкой, кривая — тенью. Цветом или стрелкой одна из них стала бы
        «правильной», а вердикта у кривой нет (см. `OverlayTempo`).
      */
      #tempo .tier {
        min-width: 14px;
        padding: 0 3px;
        text-align: center;
        border: 1px solid transparent;
        border-radius: 3px;
        font-variant-numeric: tabular-nums;
      }

      #tempo .tier.you {
        border-color: var(--muted);
        color: #eceff1;
      }

      #tempo .tier.curve {
        box-shadow: inset 0 -2px 0 var(--muted);
      }

      #tempo .tier.locked {
        color: #5f6368;
      }

      /* ── Сила стола ──────────────────────────────────────────────────── */

      /*
        Блок отвечает на вопрос игрока «сильный мой стол для этого хода или
        нет» и НЕ отвечает на следующий за ним — «усиливаться или качаться»:
        этот выбор ближайшим боем не решается (см. `OverlayStrength`).
        Отсюда вся его внешность: ни зелёного, ни красного, ни стрелок.
        Цветом «62 %» стало бы либо похвалой, либо тревогой, а число — просто
        доля выигранных боёв.
      */
      #strength {
        font-size: 12px;
        color: var(--muted);
      }

      #strength .value {
        font-variant-numeric: tabular-nums;
        color: #eceff1;
      }

      /*
        Полоска — это шкала от нуля до ста, а не индикатор «хорошо/плохо».
        На ней две метки, и обе фактические: где стоит игрок и где стоит
        РОВНЯ со столом (50 %). Без второй метки первая ничего не значит —
        игрок не обязан помнить, что половина боёв это норма.
      */
      #strength .bar {
        position: relative;
        display: inline-block;
        width: 90px;
        height: 7px;
        margin: 0 6px;
        vertical-align: middle;
        background: #2c3034;
        border: 1px solid #4a4f55;
        border-radius: 3px;
        overflow: hidden;
      }

      #strength .fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        background: #8d949b;
      }

      #strength .even {
        position: absolute;
        top: -2px;
        bottom: -2px;
        left: 50%;
        width: 1px;
        background: var(--muted);
      }

      /* ── Прогноз места ───────────────────────────────────────────────── */

      /*
        Самый нижний блок и самый тихий: он ничего не советует, а обрезка
        окна съедает нижнее первым — терять надо именно его.

        Число и его ошибка набраны ОДНИМ размером и одним цветом: прогноз,
        промахивающийся на 1.7 места, набранный крупно и ярко, читался бы
        как знание. Выделения нет вовсе — ни цвета, ни веса.
      */
      #forecast {
        font-size: 12px;
        color: var(--muted);
      }

      #forecast .value {
        font-variant-numeric: tabular-nums;
        color: #eceff1;
      }
    </style>
  </head>
  <body>
    <!--
      Порядок узлов — порядок важности, и это не вкус: окно фиксированной
      высоты, прокрутки нет и быть не может (оно сквозное для мыши и не берёт
      фокус), поэтому переполнение обрезается МОЛЧА. Значит терять оно обязано
      снизу: сначала прогноз места (он ничего не советует вовсе) и темп (фон
      без вердикта), потом витрину и борд — их игрок видит в самой игре, —
      и лишь в последнюю очередь действенное.

      С D285 на виду только основная линия, а прочее свёрнуто в кнопки
      разделов; раскрытые разделы идут под кнопками в том же порядке
      важности, так что обрезка по-прежнему съедает фон первым.
    -->
    <div id="stage"></div>

    <!--
      Борда и витрины в панели больше нет НАМЕРЕННО: они были контекстом —
      «что сейчас на столе», — а стол игрок теперь видит сам, и метки
      показывают прямо на его картах. Строка списка дублировала бы экран.
      Поля в виде остались: их читают тесты, и они описывают положение,
      а не его показ.
    -->
    <div id="card" class="idle">
      <div id="header">жду партию</div>
      <div id="plan"></div>
      <div id="main"></div>
      <div id="chips"></div>
      <div id="details"></div>
    </div>

    <script>
      // Разметка ничего не решает об игре: приходит готовый вид, она его
      // рисует. Какая клетка чья, какой тон у числа, какая подпись у столбика,
      // какие разделы есть и есть ли блок вообще — всё это поля вида,
      // посчитанные в `view.ts` и покрытые тестами. Здесь не должно появиться
      // ни одного условия про игру. Своё у разметки только двое: какие
      // разделы игрок раскрыл и где стоит курсор.
      const el = (id) => document.getElementById(id);

      // Тон `normal` — это отсутствие класса: правила для него нет, и выдавать
      // класс без правила значило бы держать вид работающим по совпадению.
      const toneClass = (tone) => (tone === 'normal' || !tone ? '' : tone);

      function node(tag, text, cls) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        // textContent, а не innerHTML: строки несут имена карт из снапшота,
        // то есть данные, которых мы не писали.
        n.textContent = text;
        return n;
      }

      const line = (text, cls) => node('div', text, cls ? `line ${cls}` : 'line');

      // Прямоугольник приходит долями окна — разметке остаётся перевести
      // их в проценты. Ни одного числа про раскладку игры тут нет.
      const box = (rect) => ({
        left: rect.x * 100 + '%',
        top: rect.y * 100 + '%',
        width: rect.w * 100 + '%',
        height: rect.h * 100 + '%',
      });

      function stageLayer(target, marks, order) {
        target.replaceChildren();

        for (const mark of marks || []) {
          const r = mark.rect;
          const ring = node('div', '', 'ring ' + mark.tone);
          Object.assign(ring.style, box(r));
          target.appendChild(ring);

          if (mark.label) {
            // Подпись у витрины и кнопок — СВЕРХУ, у борда снизу: иначе она
            // садится ровно на номера расстановки соседнего ряда.
            const above = mark.row !== 'board';
            const tag = node('div', mark.label, 'tag ' + mark.tone);
            Object.assign(tag.style, {
              left: (r.x + r.w / 2) * 100 + '%',
              top: above ? `calc(${(r.y * 100).toFixed(3)}% - 24px)` : (r.y + r.h) * 100 + '%',
            });
            target.appendChild(tag);
          }

          if (mark.step !== null) {
            const no = node('div', String(mark.step), 'stepno ' + mark.tone);
            Object.assign(no.style, { left: r.x * 100 + '%', top: (r.y + r.h * 0.2) * 100 + '%' });
            target.appendChild(no);
          }
        }

        for (const o of order || []) {
          const no = node('div', String(o.order), 'orderno' + (o.moved ? ' moved' : ''));
          Object.assign(no.style, {
            left: (o.rect.x + o.rect.w / 2) * 100 + '%',
            top: o.rect.y * 100 + '%',
          });
          target.appendChild(no);
        }
      }

      function planBlock(target, plan) {
        target.replaceChildren();
        // Пустого блока не бывает: рамка без содержимого на прозрачном окне
        // читается как неисправность и утверждает, что советник думал
        // и не придумал.
        if (!plan) return;

        const head = node('div', '', 'head');
        head.append(
          node('span', `ПЛАН ХОДА · золото ${plan.gold}`),
          node('span', plan.goldCaption, 'cap'),
        );
        target.appendChild(head);

        for (const step of plan.steps) {
          const box = node('div', '', 'step');
          box.append(
            node('span', `${step.no}`, 'no'),
            node('span', step.text, 'what'),
            node('span', `${step.goldAfter}`, `gold ${toneClass(step.goldTone)}`.trim()),
          );
          target.appendChild(box);
        }

        if (plan.restVerbs.length > 0) {
          target.appendChild(
            line(`…и ещё ${plan.restVerbs.length}: ${plan.restVerbs.join(', ')}`, 'rest'),
          );
        }
        if (plan.tail) {
          target.appendChild(line(plan.tail.text, `tail ${toneClass(plan.tail.tone)}`.trim()));
        }
      }

      function tempoBlock(target, tempo) {
        target.replaceChildren();
        if (!tempo) return;

        const head = node('div', '', 'line');
        head.appendChild(node('span', tempo.label, 'label'));
        const strip = node('span', '', 'strip');
        for (const cell of tempo.cells) {
          const marks = ['tier'];
          if (cell.you) marks.push('you');
          if (cell.curve) marks.push('curve');
          if (cell.locked) marks.push('locked');
          const column = node('span', '', 'cell');
          column.appendChild(node('span', `${cell.tier}`, marks.join(' ')));
          // Подпись — словами и у самой клетки: обе метки названы, ни одна
          // не выделена (part43, «она мне что-то рекомендует?»).
          const caption = [cell.you ? 'вы' : '', cell.curve ? 'кривая' : '']
            .filter((x) => x)
            .join('·');
          column.appendChild(node('span', caption, 'cap'));
          strip.appendChild(column);
        }
        head.appendChild(strip);
        target.appendChild(head);

        // Тир игрока и тир кривой названы словами ПРЯМО НА ШКАЛЕ, поэтому
        // здесь остаётся только то, чего на шкале нет: ход таверны (шкала,
        // в которой кривая и написана) и цена подъёма. Прежде эта строка
        // повторяла оба тира числами — с подписями у клеток это было бы
        // третье повторение одного и того же.
        const upgrade = tempo.upgrade
          ? ` · подъём до ${tempo.upgrade.target} за ${tempo.upgrade.cost}`
          : '';
        target.appendChild(line(`ход таверны ${tempo.tavernTurn}${upgrade}`));
        if (tempo.note) target.appendChild(line(tempo.note));
        // Чем платит ход, потраченный на тир: те же числа блока силы,
        // приведённые к решению («могу ли перейти безопасно», part68).
        if (tempo.risk) target.appendChild(line(tempo.risk));
      }

      function strengthBlock(target, strength) {
        target.replaceChildren();
        if (!strength) return;

        // Первая строка — само число и шкала под ним; ярлык «не совет»
        // стоит в ней же и последним, как у прогноза места: подпись, которую
        // можно потерять отдельно от числа, обещала бы не то.
        const row = node('div', '', 'line');
        row.appendChild(node('span', 'ваш стол берёт ', 'label'));
        row.appendChild(node('span', `${Math.round(strength.percent)} %`, 'value'));
        // «сейчас» — не украшение. Число считается по борду, который стоит
        // НА СТОЛЕ, а в начале хода он ещё не укомплектован: на настоящей
        // партии (part44) оценка в начале хода и после покупок расходилась
        // как 6 % против 70 %. Без этого слова первое читалось бы как
        // приговор ходу, а это всего лишь «бой прямо сейчас».
        row.appendChild(node('span', ' боёв сейчас', 'label'));

        const bar = node('span', '', 'bar');
        const fill = node('span', '', 'fill');
        // Ширина заливки — то же число, что и в подписи: два представления
        // одной величины, а не два числа.
        fill.style.width = `${Math.max(0, Math.min(100, strength.percent))}%`;
        bar.appendChild(fill);
        bar.appendChild(node('span', '', 'even'));
        row.appendChild(bar);
        row.appendChild(node('span', strength.label, 'label'));
        target.appendChild(row);

        // Вторая строка — из чего число и цена ошибки. Цена и делает первое
        // применимым: 40 % при полном запасе здоровья и 40 % на двадцати
        // очках — разные положения. Молчит, когда цена посчитана по горстке
        // боёв (`loss === null`).
        // Склонение — не косметика: «41 бордов» читается как опечатка,
        // а опечатка в подписи заставляет перечитывать само число.
        const n = strength.boards;
        const last = n % 10;
        const tens = n % 100;
        const word =
          last === 1 && tens !== 11
            ? 'борд'
            : last >= 2 && last <= 4 && (tens < 12 || tens > 14)
              ? 'борда'
              : 'бордов';
        const source = `ход таверны ${strength.tavernTurn} · ${n} ${word} соперников`;
        target.appendChild(
          line(
            strength.loss
              ? `${source} · поражение ~${Math.round(strength.loss.hp)} hp, у вас ${strength.hp}`
              : `${source} · у вас ${strength.hp} hp`,
          ),
        );

        // Третья строка — и только когда есть что сказать. Смерть приходит
        // уже отфильтрованной порогом (`death === null` — «этот бой вас
        // не убивает»), поэтому условия про проценты здесь нет: разметка
        // по-прежнему ничего не решает.
        if (strength.death !== null && strength.death !== undefined) {
          target.appendChild(line(`смерть в ${Math.round(strength.death)} % этих боёв`));
        }
      }

      function forecastBlock(target, forecast) {
        target.replaceChildren();
        if (!forecast) return;

        // Ошибка идёт В ТОЙ ЖЕ строке и тем же тоном, что число: подпись,
        // которую можно потерять при обрезке отдельно от прогноза, обещала бы
        // точность, которой у него нет.
        const row = node('div', '', 'line');
        row.appendChild(node('span', 'ожидаемое место ', 'label'));
        row.appendChild(
          node('span', `${forecast.place.toFixed(1)} ± ${forecast.error.toFixed(1)}`, 'value'),
        );
        row.appendChild(
          node('span', ` · ${forecast.label} · по ${forecast.games} партиям`, 'label'),
        );
        target.appendChild(row);
      }

      // Где на окне лежит экран: главный процесс считает это по фактическому
      // размеру окна (`stageBox`), разметке остаётся приложить пиксели.
      //
      // Канал проверяется на существование не из вежливости: разметка и мост
      // едут в сборку РАЗНЫМИ файлами (`index.html` копируется, `preload.cjs`
      // компилируется), и старый мост рядом с новой разметкой уронил бы
      // окно целиком — а на прозрачном окне без консоли это выглядит как
      // «оверлей не работает». Без канала слой ведёт себя как прежде,
      // во всё окно.
      window.overlay.onStage?.((box) => {
        if (!box) return;
        Object.assign(el('stage').style, {
          left: box.left + 'px',
          top: box.top + 'px',
          width: box.width + 'px',
          height: box.height + 'px',
        });
      });

      // Строки списка — маркером «•», а не «▸»: треугольник теперь значит
      // «раскрыть», и на строке совета он обещал бы то, чего там нет.
      function linesBlock(target, lines) {
        for (const item of lines || []) {
          target.appendChild(line(`• ${item.text}`, toneClass(item.tone)));
        }
      }

      // Чем раздел наполняется — по его ключу; какие разделы есть, решил вид.
      const SECTION_BODY = {
        alternatives: (target, view) => linesBlock(target, view.alternatives),
        position: (target, view) => {
          if (!view.position) return;
          target.appendChild(
            line(`расстановка: ${view.position.text}`, toneClass(view.position.tone)),
          );
        },
        reminders: (target, view) => linesBlock(target, view.reminders),
        strength: (target, view) => strengthBlock(target, view.strength),
        tempo: (target, view) => tempoBlock(target, view.tempo),
        forecast: (target, view) => forecastBlock(target, view.forecast),
      };

      // Какие разделы игрок раскрыл. Живёт, пока живёт окно: переживает
      // каждый новый вид (а они приходят после каждого действия в игре)
      // и смену партии, но не перезапуск — на старте всё свёрнуто.
      const opened = new Set();
      let lastView = null;

      function render(view) {
        lastView = view;
        el('card').className = view.active ? '' : 'idle';
        el('header').textContent = view.header;

        planBlock(el('plan'), view.plan);

        const main = el('main');
        main.replaceChildren();
        for (const item of view.main || []) {
          main.appendChild(line(item.text, toneClass(item.tone)));
        }

        const chips = el('chips');
        const details = el('details');
        chips.replaceChildren();
        details.replaceChildren();
        for (const section of view.sections || []) {
          const isOpen = opened.has(section.key);
          const chip = node(
            'button',
            `${isOpen ? '▾' : '▸'} ${section.title}`,
            ['chip', toneClass(section.tone), isOpen ? 'open' : ''].filter((x) => x).join(' '),
          );
          chip.type = 'button';
          chip.tabIndex = -1;
          chip.dataset.key = section.key;
          chips.appendChild(chip);

          if (isOpen && SECTION_BODY[section.key]) {
            // id раздела — тот же, под которым его блок описан в стилях.
            const body = node('div', '');
            body.id = section.key;
            SECTION_BODY[section.key](body, view);
            details.appendChild(body);
          }
        }

        // Метки поверх настоящих карт — последним: они рисуются в своём слое
        // и на панель не влияют.
        stageLayer(el('stage'), view.marks, view.order);

        // Новый вид мог убрать кнопку из-под неподвижного курсора — тогда
        // окно обязано снова стать сквозным, не дожидаясь движения мыши.
        syncInteractive();
      }

      el('chips').addEventListener('click', (event) => {
        const chip = event.target.closest('.chip');
        if (!chip || !lastView) return;
        const key = chip.dataset.key;
        if (opened.has(key)) opened.delete(key);
        else opened.add(key);
        render(lastView);
      });

      // ── Где курсор ────────────────────────────────────────────────────
      //
      // Окно сквозное для мыши, и щелчки уходят в игру. Чтобы кнопку
      // раздела можно было нажать, окно должно принимать щелчки — но только
      // пока курсор стоит НА НЕЙ: окно во весь экран, и принимающее щелчки
      // где-то ещё отнимало бы у игры стол. Движения мыши приходят сюда
      // и сквозь окно (`forward` в window.ts), поэтому разметка видит курсор
      // всегда и сообщает главному процессу одно булево значение.
      let pointer = null;
      let interactive = false;

      function overChip() {
        if (pointer === null) return false;
        const hit = document.elementFromPoint(pointer.x, pointer.y);
        return hit !== null && hit.closest('.chip') !== null;
      }

      function syncInteractive() {
        const wanted = overChip();
        if (wanted === interactive) return;
        interactive = wanted;
        // Старый мост без канала — окно просто остаётся сквозным.
        window.overlay.setInteractive?.(wanted);
      }

      document.addEventListener('mousemove', (event) => {
        pointer = { x: event.clientX, y: event.clientY };
        syncInteractive();
      });

      // Курсор ушёл из окна совсем (на второй монитор) — щелчки отдать игре.
      document.addEventListener('mouseout', (event) => {
        if (event.relatedTarget !== null) return;
        pointer = null;
        syncInteractive();
      });

      window.overlay.onView(render);
    </script>
  </body>
</html>
